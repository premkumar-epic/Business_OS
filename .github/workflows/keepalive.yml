name: Keep Supabase Alive

on:
  schedule:
    # Run at 00:00 every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Project
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
               -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
               -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          echo "Pinged Supabase to keep it active."
